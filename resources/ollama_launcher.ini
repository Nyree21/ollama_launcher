; ============================================================================
; ollama_launcher.ini - configuration file
;
; Place this file next to ollama_launcher.exe. UTF-8, a BOM is allowed.
; The settings dialog writes back to this file; a restart is needed for most
; changes. Nothing here touches the registry or system environment variables.
; ============================================================================

[server]
; Absolute path of ollama.exe. Leave empty to auto-detect a standard install
; location or a matching executable on PATH.
ollama_path=
; Directory passed to the child process as OLLAMA_MODELS.
; Leave empty to use Ollama's own default (~/.ollama/models).
models_dir=
; Listen address and port, exported as OLLAMA_HOST=host:port.
host=127.0.0.1
port=11434
; Extra arguments appended to "ollama serve", for example: --verbose
extra_args=

; Extra environment variables (KEY=VALUE) injected into the ollama process.
; They may override the values above.
[env]
; Keep Ollama offline: without this it fetches its cloud model list on start.
OLLAMA_NOCLOUD=1
;OLLAMA_IGPU_ENABLE=1
;OLLAMA_KEEP_ALIVE=30m

[proxy]
; Stats proxy. Clients connect to this port instead of the Ollama port; the
; proxy forwards every request unchanged and reads eval_count /
; prompt_eval_duration from the response to accumulate tokens and TTFT.
; Disable it if you only need the service and connect clients directly.
enabled=true
port=11500

[ui]
; Start ollama serve together with the launcher.
auto_start=false
; Closing the window hides it to the tray instead of quitting.
close_to_tray=true
; Monitor polling interval in milliseconds (minimum 500).
refresh_ms=2000
; Log level: debug | info | warn | error
log_level=info
; Interface language: en | zh
language=en
