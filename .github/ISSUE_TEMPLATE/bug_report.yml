name: Bug report
description: Something does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please fill in as much as
        you can — the log excerpt and the version numbers are usually what makes
        a bug reproducible.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour, including any error message shown in the UI.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the launcher with ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Launcher version
      description: Shown in the window title or the status bar.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      description: Output of `ollama --version`.
    validations:
      required: false

  - type: dropdown
    id: build
    attributes:
      label: How did you get the binary?
      options:
        - Prebuilt release archive
        - Built from source
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Windows and Qt version
      placeholder: "Windows 11 23H2, Qt 6.8.3 MinGW 13.1"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Copy the affected lines from the log panel (right-click copies the selection).
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your `ollama_launcher.ini` with any private paths replaced by placeholders.
      render: ini
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest release or a build of the current `main`.
          required: false
