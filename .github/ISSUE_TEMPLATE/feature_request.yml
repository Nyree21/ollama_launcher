name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first and the proposed solution second. Ideas
        that come with a use case are much easier to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What are you doing today, and where does it get in the way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the app does this touch?
      multiple: true
      options:
        - Service control (start / stop)
        - Monitoring and metrics
        - Benchmark
        - Statistics proxy
        - Log panel
        - Settings and configuration
        - Interface, translations and accessibility
        - Build and packaging
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
